name: Release Draft (manual, artifacts only)

# Manual-only build/package/verify workflow. It does NOT publish a GitHub
# Release, does NOT move or create a tag, does NOT need any Apple secret,
# does NOT simulate/claim notarization or signing. Output is uploaded as
# workflow artifacts for a human to inspect and decide what to do with —
# publishing a real release remains a separate, deliberate, human action.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Artifact version label (e.g. 0.7.0)"
        required: true
        default: "0.7.0"

permissions:
  contents: read

concurrency:
  group: release-draft-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-package-verify:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Doctor (toolchain/prereqs)
        run: Scripts/doctor.sh

      - name: Repository checks (policy files, private data, placeholders)
        run: Scripts/repository-doctor.sh

      - name: License check
        run: Scripts/check-licenses.sh

      - name: Private-data check
        run: Scripts/check-private-data.sh

      - name: Version consistency check
        run: Scripts/check-version-consistency.sh

      - name: Test suite
        run: Scripts/test.sh

      - name: Release build (0 warnings expected)
        run: swift build -c release 2>&1 | tee /tmp/release-build.log

      - name: Fail on release-build warnings
        run: |
          if grep -q "warning:" /tmp/release-build.log; then
            echo "Release build produced warnings — see log above."
            exit 1
          fi

      - name: Test isolation gate (no test may reach a real user store)
        run: Scripts/check-test-isolation.sh

      - name: Build artifacts and generate provenance manifest
        # build-release.sh packages ZIP + DMG and generates dist/latest.json and
        # dist/SHA256SUMS from Release/latest.template.json. It refuses a dirty
        # tree, so sourceCommit always names the commit that was actually
        # packaged. See Documentation/RELEASE_PROVENANCE.md.
        run: bash Scripts/build-release.sh "${{ inputs.version }}"

      - name: Release manifest gate
        run: Scripts/test-release-manifest.sh

      - name: Verify checksums (self-check, never executes artifacts)
        run: |
          cd dist
          shasum -a 256 -c SHA256SUMS

      - name: Verify artifacts do not claim signed/notarized status
        # This workflow has no Apple secret and performs no signing, so a
        # signed/notarized:true claim could only be false.
        run: |
          if grep -riE '"signed"[[:space:]]*:[[:space:]]*true|"notarized"[[:space:]]*:[[:space:]]*true' dist/latest.json 2>/dev/null; then
            echo "Release manifest claims signed/notarized — this workflow must never publish that claim."
            exit 1
          fi
          echo "OK: no signed/notarized:true claim present."

      - name: Show recorded provenance
        run: |
          /usr/bin/python3 -c "
          import json
          m = json.load(open('dist/latest.json'))
          for k in ('version','sourceCommit','releaseTag','treeState','releasable','buildDate_UTC','buildInvocationID'):
              print(f'{k}: {m.get(k)}')
          "

      - name: Check for unresolved placeholder tokens (informational)
        # Not a hard gate: pre-release placeholder tokens (e.g. security
        # contact) are expected until Documentation/HUMAN_BLOCKERS.md is
        # resolved by a human. Logged for visibility, doesn't fail the run.
        run: Scripts/check-placeholders.sh || true

      - name: Upload ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CoreTend-${{ inputs.version }}-arm64-unsigned-zip
          path: Release/CoreTend-${{ inputs.version }}-arm64-unsigned.zip
          retention-days: 14

      - name: Upload DMG
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CoreTend-${{ inputs.version }}-arm64-unsigned-dmg
          path: Release/CoreTend-${{ inputs.version }}-arm64-unsigned.dmg
          retention-days: 14

      - name: Upload checksums and provenance manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CoreTend-${{ inputs.version }}-checksums-and-manifest
          path: |
            dist/SHA256SUMS
            dist/latest.json
          retention-days: 14
