name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Doctor (toolchain/prereqs)
        run: Scripts/doctor.sh

      - name: Repository checks (policy files, private data, placeholders)
        run: Scripts/repository-doctor.sh

      - name: License check
        run: Scripts/check-licenses.sh

      - name: Private-data check
        run: Scripts/check-private-data.sh

      - name: Placeholder check
        run: Scripts/check-placeholders.sh

      - name: Feature inventory totals (recomputed, never hand-typed)
        run: Scripts/check-feature-inventory.sh

      - name: Markdown link check (zero broken internal links/anchors)
        run: python3 Scripts/check-markdown-links.py

      - name: Debug build
        run: Scripts/build.sh

      - name: Tests
        run: Scripts/test.sh

      - name: Release build (0 warnings expected)
        run: swift build -c release 2>&1 | tee /tmp/release-build.log

      - name: Fail on release-build warnings
        run: |
          if grep -q "warning:" /tmp/release-build.log; then
            echo "Release build produced warnings — see log above."
            exit 1
          fi

      - name: Package local app bundle
        run: Scripts/package-local.sh

      - name: Bundle sanity check
        run: |
          test -d "build/CoreTend.app" || { echo "app bundle not found"; exit 1; }
          test -f "build/CoreTend.app/Contents/Info.plist" || { echo "Info.plist missing"; exit 1; }

      - name: Visual regression (72 captures, 9 viewports, FR+EN)
        run: |
          npm install --no-save playwright pngjs
          npx playwright install --with-deps chromium
          ( cd Website && python3 -m http.server 8788 & )
          sleep 3
          node Scripts/visual/capture.mjs

      - name: Release/sync consistency gate (fails on version divergence)
        run: bash Scripts/test-release-sync.sh

      - name: Localization key-parity check
        run: |
          base="Sources/CoreTendApp/Resources/Base.lproj/Localizable.strings"
          fr="Sources/CoreTendApp/Resources/fr.lproj/Localizable.strings"
          base_keys="$(mktemp)"
          fr_keys="$(mktemp)"
          trap 'rm -f "$base_keys" "$fr_keys"' EXIT
          iconv -f UTF-16 -t UTF-8 "$base" |
            sed -n 's/^"\([^"]*\)".*/\1/p' | sort -u > "$base_keys"
          iconv -f UTF-16 -t UTF-8 "$fr" |
            sed -n 's/^"\([^"]*\)".*/\1/p' | sort -u > "$fr_keys"
          echo "Base: $(wc -l < "$base_keys") keys, fr: $(wc -l < "$fr_keys") keys"
          if ! diff -u "$base_keys" "$fr_keys"; then
            echo "Localization keys differ between Base and fr."
            exit 1
          fi

  distribution-check:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Doctor (toolchain/prereqs)
        run: Scripts/doctor.sh

      - name: Version consistency check
        run: Scripts/check-version-consistency.sh

      - name: Placeholder / license / private-data checks
        run: |
          Scripts/check-placeholders.sh
          Scripts/check-licenses.sh
          Scripts/check-private-data.sh

      - name: Package ZIP and DMG, verify checksums, run distribution tests
        run: Scripts/test-distribution.sh 0.0.0-ci

      - name: Release-manifest / checksum / dangerous-command checks
        run: Scripts/test-release-manifest.sh

      - name: Uninstall script tests
        run: Scripts/test-uninstall.sh
