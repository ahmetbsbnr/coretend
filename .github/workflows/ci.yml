name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  qualify:
    # Runs on the public repository only.
    if: github.repository == 'ahmetbsbnr/coretend'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build, tests, safety audit and site checks
        run: make check
      - name: Whitespace check
        run: git diff --check
