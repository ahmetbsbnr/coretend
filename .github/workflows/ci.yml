name: CoreTend Next CI

on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]

permissions:
  contents: read

jobs:
  qualify:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build, fixtures, site and contracts
        run: make qualify
      - name: Whitespace check
        run: git diff --check
