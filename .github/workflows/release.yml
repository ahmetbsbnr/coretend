name: Release (tag-triggered, publishes)

# The one workflow that publishes. It builds from a clean checkout of an
# annotated version tag on the dedicated signing runner. It proves the tag
# matches the version recorded inside the repository, runs the full test and
# policy suite, signs with Developer ID, notarizes and staples the final
# artifacts, generates their manifest and SBOM, attests those exact bytes,
# signs the verification files with Minisign, and only then publishes.
#
# What this workflow will never do, by construction:
#   - publish a backup/* tag (guarded explicitly below)
#   - claim signed or notarized status it did not produce
#   - print a secret, or write one into an artifact
#   - publish when the tag and the in-repo version disagree
#   - publish when a declared artifact or its checksum is missing
#
# This intentionally requires a maintainer-controlled self-hosted Apple-silicon
# Mac. GitHub-hosted runners cannot access the non-exported Developer ID private
# key or the notarytool keychain profile. Missing signing material is a hard
# failure: a release tag must never fall back to unsigned artifacts.

on:
  push:
    tags:
      # Version tags only. backup/* and every other ref shape is unmatched,
      # so a safety tag can never trigger a publication.
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"

# Least privilege by default; each job widens only what it needs.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, macOS, ARM64, coretend-signing]
    # Generous on purpose: Apple's notarization queue is the variable here, and
    # this job now also downloads the draft's assets back and re-verifies them.
    # Aborting after notarization has already been paid for is the worst
    # possible place to run out of time.
    #
    # Note this bounds EXECUTION, not queueing. A job waiting for an offline
    # self-hosted runner sits queued for GitHub's 24h maximum and is then
    # cancelled with no step ever run — which is exactly how v1.1.0-beta.1 and
    # v1.2.0-beta.1 died. Scripts/release-preflight.sh checks the runner is
    # online before you tag, because nothing downstream will tell you.
    timeout-minutes: 75
    permissions:
      # contents: write is required only by the final publish step, which
      # creates the GitHub Release and uploads its assets. Everything else in
      # this job reads. There is no repo-wide write grant.
      contents: write
      id-token: write # provenance attestation signing (OIDC)
      attestations: write # store the attestation
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      channel: ${{ steps.resolve.outputs.channel }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - name: Checkout the tag (full history, clean tree)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse to publish a non-version tag
        # Defence in depth: the `on:` filter already excludes backup/*, but a
        # workflow_dispatch or a filter edit must not be able to slip one
        # through. Publishing a safety tag would expose an internal snapshot.
        run: |
          ref="${GITHUB_REF#refs/tags/}"
          case "$ref" in
            backup/*|*backup*)
              echo "::error::Refusing to publish backup tag '$ref'."
              exit 1 ;;
          esac
          if ! printf '%s' "$ref" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-(rc|beta)\.[0-9]+)?$'; then
            echo "::error::Tag '$ref' is not a release version tag."
            exit 1
          fi
          echo "Tag accepted: $ref"

      - name: Resolve version and channel from the single source of truth
        id: resolve
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          tag_version="${tag#v}"
          repo_version="$(/usr/bin/python3 -c "import json;print(json.load(open('Configuration/PublicIdentity.example.json'))['marketingVersion'])")"
          if [ "$tag_version" != "$repo_version" ]; then
            echo "::error::Tag says $tag_version but Configuration/PublicIdentity.example.json says $repo_version."
            exit 1
          fi
          case "$tag_version" in
            *-rc.*)    channel=release-candidate; prerelease=true ;;
            *-beta.*)  channel=beta;              prerelease=true ;;
            *)         channel=stable;            prerelease=false ;;
          esac
          repo_channel="$(/usr/bin/python3 -c "import json;print(json.load(open('Configuration/PublicIdentity.example.json'))['channel'])")"
          if [ "$channel" != "$repo_channel" ]; then
            echo "::error::Tag implies channel '$channel' but the repository declares '$repo_channel'."
            exit 1
          fi
          {
            echo "version=$tag_version"
            echo "channel=$channel"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "version=$tag_version channel=$channel prerelease=$prerelease"

      - name: Doctor (toolchain/prereqs)
        run: Scripts/doctor.sh

      - name: Repository, licence, private-data and placeholder gates
        run: |
          Scripts/repository-doctor.sh
          Scripts/check-licenses.sh
          Scripts/check-private-data.sh
          Scripts/check-placeholders.sh

      - name: Version consistency across Info.plist, state and changelog
        run: Scripts/check-version-consistency.sh

      - name: Release/sync consistency gate (fails on version divergence)
        run: bash Scripts/test-release-sync.sh

      - name: Release preflight (everything knowable before Apple is involved)
        # Runs before the test suite and long before notarization: a wrong
        # Minisign key, a missing secret, an absent runner or a version that
        # disagrees with itself all fail here, in seconds, having published
        # nothing and having spent no Apple round trip.
        env:
          CORETEND_DEVELOPER_ID_APPLICATION: ${{ secrets.CORETEND_DEVELOPER_ID_APPLICATION }}
          CORETEND_NOTARY_PROFILE: ${{ secrets.CORETEND_NOTARY_PROFILE }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash Scripts/release-preflight.sh "${{ steps.resolve.outputs.version }}" --signing

      - name: Test suite
        run: Scripts/test.sh

      - name: Test isolation gate
        run: Scripts/check-test-isolation.sh

      - name: Release build (zero warnings required)
        run: |
          set -o pipefail
          swift build -c release 2>&1 | tee /tmp/release-build.log
          if grep -q "warning:" /tmp/release-build.log; then
            echo "::error::Release build produced warnings."
            exit 1
          fi

      - name: Build, Developer ID sign, notarize and staple final artifacts
        env:
          CORETEND_DEVELOPER_ID_APPLICATION: ${{ secrets.CORETEND_DEVELOPER_ID_APPLICATION }}
          CORETEND_NOTARY_PROFILE: ${{ secrets.CORETEND_NOTARY_PROFILE }}
        run: |
          set -euo pipefail
          : "${CORETEND_DEVELOPER_ID_APPLICATION:?CORETEND_DEVELOPER_ID_APPLICATION secret is required}"
          : "${CORETEND_NOTARY_PROFILE:?CORETEND_NOTARY_PROFILE secret is required}"
          Scripts/package-local.sh
          Scripts/sign-and-notarize.sh \
            "${{ steps.resolve.outputs.version }}" \
            "$CORETEND_NOTARY_PROFILE"

      - name: Generate manifest from final signed bytes
        env:
          CORETEND_RELEASE_SIGNED: "1"
        run: bash Scripts/build-release.sh "${{ steps.resolve.outputs.version }}"

      - name: Release manifest gate
        run: Scripts/test-release-manifest.sh

      - name: DMG window layout gate
        # 0.9.1-rc.2 shipped with no .DS_Store, so the installer opened as a
        # bare Finder window. The layout is generated deterministically now
        # (dmgbuild, no Finder), and this asserts it survived into the artifact
        # that is about to be published. There is deliberately no opt-out here.
        run: |
          zsh Scripts/test-dmg-layout.sh \
            "dist/CoreTend-${{ steps.resolve.outputs.version }}-arm64.dmg" \
            "CoreTend ${{ steps.resolve.outputs.version }}"

      - name: Verify every declared artifact exists and matches its checksum
        run: |
          set -euo pipefail
          cd dist
          shasum -a 256 -c SHA256SUMS
          /usr/bin/python3 - <<'PY'
          import json, os, sys
          m = json.load(open("latest.json"))
          missing = [n for n in (m["zipName"], m["dmgName"]) if not os.path.exists(n)]
          if missing:
              sys.exit(f"Declared artifact(s) missing from dist/: {missing}")
          for name, key in ((m["zipName"], "zipSize"), (m["dmgName"], "dmgSize")):
              actual = os.path.getsize(name)
              if actual != m[key]:
                  sys.exit(f"{name}: manifest says {m[key]} bytes, file is {actual}")
          print("All declared artifacts present, sized and checksummed.")
          PY

      - name: Require signed, notarized and stapled final artifacts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          manifest = json.load(open("dist/latest.json"))
          if manifest.get("signed") is not True or manifest.get("notarized") is not True:
              raise SystemExit("manifest must declare signed:true and notarized:true")
          PY
          codesign --verify --deep --strict --verbose=2 build/CoreTend.app
          xcrun stapler validate build/CoreTend.app
          xcrun stapler validate "dist/CoreTend-${{ steps.resolve.outputs.version }}-arm64.dmg"
          spctl --assess --type execute --verbose build/CoreTend.app
          spctl --assess --type open --context context:primary-signature --verbose \
            "dist/CoreTend-${{ steps.resolve.outputs.version }}-arm64.dmg"

      - name: Generate SBOM (SPDX) for the built source tree
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          artifact-name: coretend-${{ steps.resolve.outputs.version }}-sbom.spdx.json
          output-file: dist/coretend-${{ steps.resolve.outputs.version }}-sbom.spdx.json

      - name: Attest build provenance for the published artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/CoreTend-${{ steps.resolve.outputs.version }}-arm64.zip
            dist/CoreTend-${{ steps.resolve.outputs.version }}-arm64.dmg

      - name: Sign verification files with Minisign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          : "${MINISIGN_SECRET_KEY:?MINISIGN_SECRET_KEY secret is required}"
          : "${MINISIGN_PASSWORD:?MINISIGN_PASSWORD secret is required}"
          brew install minisign
          umask 077
          keyfile="$(mktemp)"
          # Secret reaches the file through the environment, never through a
          # command line (which would be visible in the process table).
          printf '%s' "$MINISIGN_SECRET_KEY" > "$keyfile"
          cd dist
          signed=0
          for f in *.zip *.dmg *.spdx.json latest.json SHA256SUMS; do
            [ -e "$f" ] || continue
            # stdout/stderr are discarded because minisign echoes nothing
            # sensitive but the password is on stdin; a failure is caught by
            # the exit status, not by parsing output.
            if printf '%s' "$MINISIGN_PASSWORD" | minisign -S -s "$keyfile" -m "$f" >/dev/null 2>&1; then
              signed=$((signed + 1))
            else
              rm -f "$keyfile"
              echo "::error::Minisign failed to sign $f."
              exit 1
            fi
          done
          rm -f "$keyfile"
          if [ "$signed" -eq 0 ]; then
            echo "::error::A signing key is configured but nothing was signed."
            exit 1
          fi
          echo "minisign_signed=true" >> "$GITHUB_ENV"
          echo "Signed $signed artifact(s):"
          ls -1 *.minisig

      - name: Verify Minisign signatures before publishing them
        run: |
          set -euo pipefail
          cd dist
          if [ ! -f ../Configuration/minisign.pub ]; then
            echo "::error::Signatures were produced but Configuration/minisign.pub is absent."
            echo "A signature nobody can verify is worse than no signature."
            exit 1
          fi
          # Verify against the key Configuration/minisign-keys.json names for
          # THIS version, not merely against whatever minisign.pub happens to
          # hold. Those two disagreed before v1.0.1 and nothing noticed.
          PUB_FILE="$(/usr/bin/python3 ../Scripts/resolve-minisign-key.py "${{ steps.resolve.outputs.version }}" --pub)"
          KEY_ID="$(/usr/bin/python3 ../Scripts/resolve-minisign-key.py "${{ steps.resolve.outputs.version }}")"
          echo "Version ${{ steps.resolve.outputs.version }} must verify with $KEY_ID ($PUB_FILE)."
          for sig in *.minisig; do
            if ! minisign -Vm "${sig%.minisig}" -P "$(sed -n 2p "../$PUB_FILE")"; then
              echo "::error::${sig%.minisig} does not verify with $KEY_ID."
              echo "Expected: every signature made by the key the registry names for this version."
              echo "Refusing to publish. Do not rotate the published key to make this pass."
              exit 1
            fi
          done
          echo "All Minisign signatures verify with $KEY_ID."

      - name: Record the resolved release facts
        run: |
          /usr/bin/python3 -c "
          import json
          m = json.load(open('dist/latest.json'))
          for k in ('version','channel','sourceCommit','releaseTag','treeState','signed','notarized'):
              print(f'{k}: {m.get(k)}')
          "

      - name: Write the machine-readable release manifest
        # One auditable record per release, derived from what was actually
        # produced rather than retyped. Published as an asset so a release can
        # be audited later without trusting this log.
        run: |
          bash Scripts/write-release-manifest.sh \
            "${{ steps.resolve.outputs.version }}" \
            "${{ steps.resolve.outputs.channel }}" \
            "${{ github.sha }}" \
            "${{ github.run_id }}"

      # ---------------------------------------------------------------- #
      # Publishing is the LAST operation, not the one that reveals a fault.
      #
      # Until v1.0.1 the release was published directly from dist/. Every gate
      # before it inspected the builder's own files, which proves what was
      # built and says nothing about what was uploaded — and a fault found
      # afterwards is already public. So: upload as a DRAFT, download the
      # assets back, verify those bytes, and only then flip it visible.
      # A draft is invisible to users and to the "latest release" API, so a
      # failure here leaves nothing for anyone to download.
      # ---------------------------------------------------------------- #
      - name: Upload the assets as a DRAFT release (not visible to anyone)
        # Done with gh rather than a third-party action. The action failed here
        # with "Error creating asset temp dir" after uploading 10 of 11 assets,
        # leaving a draft missing only its SBOM — a partial upload is exactly
        # the failure this whole draft-first design exists to contain, and it
        # should not come from the uploader itself. gh is already required by
        # the verification step below, so this also removes one third-party
        # action from the path that touches the signing runner.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.resolve.outputs.version }}
          PRERELEASE: ${{ steps.resolve.outputs.prerelease }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          REPO="${{ github.repository }}"

          # Name every asset explicitly. A glob that silently matches nothing is
          # how an artifact goes missing without anyone noticing.
          ASSETS=(
            "dist/CoreTend-$VERSION-arm64.zip"
            "dist/CoreTend-$VERSION-arm64.dmg"
            "dist/latest.json"
            "dist/SHA256SUMS"
            "dist/release-manifest.json"
            "dist/coretend-$VERSION-sbom.spdx.json"
            "Configuration/minisign.pub"
          )
          shopt -s nullglob
          for sig in dist/*.minisig; do ASSETS+=("$sig"); done
          shopt -u nullglob

          missing=0
          for f in "${ASSETS[@]}"; do
            if [ ! -s "$f" ]; then
              echo "::error::Declared release asset is missing or empty: $f"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "Uploading ${#ASSETS[@]} assets to draft $TAG."

          EXTRA=()
          [ "$PRERELEASE" = "true" ] && EXTRA+=(--prerelease)

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            # A release already exists. Only ever touch it if it is still a
            # draft: clobbering a published release would rewrite bytes users
            # may already hold.
            if [ "$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "::error::Release $TAG is already published. Refusing to overwrite it."
              echo "Expected: no release, or a draft left by a previous attempt."
              echo "Fix: release a new patch version; never rewrite a published one."
              exit 1
            fi
            echo "Reusing the existing draft (previous attempt) and replacing its assets."
            gh release upload "$TAG" "${ASSETS[@]}" --repo "$REPO" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --repo "$REPO" \
              --draft \
              --title "CoreTend $VERSION" \
              --notes-file "Release/Notes/$VERSION.en.md" \
              "${EXTRA[@]}"
          fi

          echo "Draft assets now attached:"
          gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[] | "  \(.name)  \(.size)"'

      - name: Verify the DISTRIBUTED bytes, downloaded back from the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash Scripts/verify-published-artifacts.sh "${{ steps.resolve.outputs.version }}"

      - name: Publish the release (every gate has passed)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release edit "v${{ steps.resolve.outputs.version }}" \
            --repo "${{ github.repository }}" \
            --draft=false
          echo "Published: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ steps.resolve.outputs.version }}"

      - name: Leave no credential behind on the signing runner
        # The runner is persistent: its workspace survives the job. Anything
        # secret-shaped that a step wrote must not outlive it, including on the
        # failure paths where it matters most.
        if: always()
        run: |
          rm -f "$RUNNER_TEMP"/*.key "$RUNNER_TEMP"/minisign* 2>/dev/null || true
          find . -name '*.minisig.tmp' -delete 2>/dev/null || true
          echo "Temporary signing material removed."

  sync:
    # Tells the site and the portfolio that a new release exists. Both consume
    # the manifest that was just published; neither hardcodes a version.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Notify the portfolio repository
        # Uses a fine-grained token limited to repository_dispatch on the
        # portfolio repo. Absent token = skipped, never failed: a site sync is
        # not a reason to fail a release that already published correctly.
        env:
          SYNC_TOKEN: ${{ secrets.PORTFOLIO_SYNC_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
          CHANNEL: ${{ needs.build.outputs.channel }}
        run: |
          if [ -z "${SYNC_TOKEN:-}" ]; then
            echo "PORTFOLIO_SYNC_TOKEN not configured — skipping portfolio sync."
            exit 0
          fi
          curl -sS -X POST \
            -H "Authorization: Bearer $SYNC_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/ahmetbsbnr/ahmetbsbnrportfolio/dispatches \
            -d "{\"event_type\":\"coretend-release\",\"client_payload\":{\"version\":\"$VERSION\",\"channel\":\"$CHANNEL\"}}"
          echo "Portfolio notified for $VERSION."
