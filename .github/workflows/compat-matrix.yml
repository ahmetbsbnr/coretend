# Compatibility matrix — test-builds CoreTend against multiple macOS
# runner / Xcode-toolchain combinations to catch availability regressions the
# single-runner CI (ci.yml, macos-15) cannot see.
#
# Status: IMPLEMENTED_UNVERIFIED. This file has never been executed — it was
# authored offline (no Xcode / no second Mac in the dev environment; see
# Documentation/COMPATIBILITY.md). It must run green on GitHub-hosted runners
# once before its results can be trusted. Deployment floor is macOS 14
# (Package.swift: .macOS(.v14)); macos-13 is intentionally excluded because the
# app requires the Observation @Observable macro (macOS 14+).
name: Compatibility Matrix

on:
  workflow_dispatch:
  schedule:
    # Weekly — availability drift is slow; no need to run per-PR.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: compat-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-matrix:
    name: build+test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # runner = macOS version; xcode pins the toolchain on that image.
        include:
          - runner: macos-14
            xcode: "16.2"
          - runner: macos-15
            xcode: "16.2"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode ${{ matrix.xcode }}
        run: sudo xcode-select -s "/Applications/Xcode_${{ matrix.xcode }}.app"

      - name: Toolchain versions
        run: |
          swift --version
          xcodebuild -version

      - name: Debug build
        run: swift build

      - name: Tests
        run: Scripts/test.sh

      - name: Release build
        run: swift build -c release
