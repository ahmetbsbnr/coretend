name: Bug
description: Signaler un comportement reproductible sans données personnelles
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: observed
    attributes:
      label: Comportement observé
      description: Décrire les étapes avec fichiers synthétiques, si possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environnement
      description: Version CoreTend, macOS et architecture; aucun chemin personnel.
    validations:
      required: true
