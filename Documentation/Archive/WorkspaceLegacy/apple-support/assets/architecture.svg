<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Coretend technical architecture and reviewed action flow</title>
  <desc id="desc">The SwiftUI application shell coordinates internal modules. Reviewed destructive actions pass from view models through SafetyCore before the macOS Trash. View models and SafetyCore write separate records to local SQLite persistence. A user-initiated update check reads a fixed HTTPS manifest.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2240e2"/>
    </marker>
    <style>
      .box{fill:#fcfcfa;stroke:#17191d;stroke-width:2}
      .core{fill:#2240e2;stroke:#2240e2;stroke-width:2}
      .soft{fill:#ececf7;stroke:#2240e2;stroke-width:2}
      .system{fill:#f4f4f0;stroke:#777b84;stroke-width:1.5}
      .label{font:600 20px -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;fill:#17191d}
      .small{font:400 15px -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;fill:#494e57}
      .white{fill:#fff}
      .line{fill:none;stroke:#2240e2;stroke-width:2.5;marker-end:url(#arrow)}
      .dash{fill:none;stroke:#777b84;stroke-width:2;stroke-dasharray:7 7;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect class="core" x="330" y="24" width="540" height="78" rx="12"/>
  <text class="label white" x="600" y="56" text-anchor="middle">CoreTendApp</text>
  <text class="small white" x="600" y="82" text-anchor="middle">SwiftUI shell · NavigationSplitView · @Observable view models</text>

  <path class="line" d="M600 102 V142 H185 V174"/>
  <path class="line" d="M600 142 H455 V174"/>
  <path class="line" d="M600 142 H713 V174"/>
  <path class="line" d="M600 142 H961 V174"/>
  <path class="dash" d="M870 54 H1131 V174"/>

  <rect class="box" x="54" y="174" width="262" height="104" rx="10"/>
  <text class="label" x="185" y="210" text-anchor="middle">ScanCore + FileRules</text>
  <text class="small" x="185" y="239" text-anchor="middle">AsyncStream scans, cleanup rules,</text>
  <text class="small" x="185" y="262" text-anchor="middle">duplicates, similar images, Space Lens</text>

  <rect class="box" x="342" y="174" width="226" height="104" rx="10"/>
  <text class="label" x="455" y="210" text-anchor="middle">AppDiscovery</text>
  <text class="small" x="455" y="239" text-anchor="middle">Apps, metadata, leftovers,</text>
  <text class="small" x="455" y="262" text-anchor="middle">update mechanism detection</text>

  <rect class="box" x="600" y="174" width="226" height="104" rx="10"/>
  <text class="label" x="713" y="210" text-anchor="middle">System signals</text>
  <text class="small" x="713" y="239" text-anchor="middle">SystemMetrics + IntegrityCore</text>
  <text class="small" x="713" y="262" text-anchor="middle">Mach, Security, provenance</text>

  <rect class="box" x="852" y="174" width="218" height="104" rx="10"/>
  <text class="label" x="961" y="210" text-anchor="middle">DesignSystem</text>
  <text class="small" x="961" y="239" text-anchor="middle">Semantic colors, typography,</text>
  <text class="small" x="961" y="262" text-anchor="middle">motion and shared components</text>

  <rect class="system" x="1078" y="174" width="106" height="104" rx="10"/>
  <text class="small" x="1131" y="208" text-anchor="middle">Fixed HTTPS</text>
  <text class="small" x="1131" y="231" text-anchor="middle">update</text>
  <text class="small" x="1131" y="254" text-anchor="middle">manifest</text>

  <path class="line" d="M330 82 H20 V304 H411 V337"/>
  <path class="line" d="M870 82 H1186 V304 H774 V337"/>

  <rect class="soft" x="266" y="337" width="290" height="92" rx="10"/>
  <text class="label" x="411" y="373" text-anchor="middle">SafetyCore</text>
  <text class="small" x="411" y="401" text-anchor="middle">Approve, revalidate, dry run, audit event</text>

  <rect class="soft" x="644" y="337" width="260" height="92" rx="10"/>
  <text class="label" x="774" y="373" text-anchor="middle">Persistence actor</text>
  <text class="small" x="774" y="401" text-anchor="middle">SQLite3 · WAL · local migrations</text>

  <rect class="system" x="40" y="455" width="1040" height="48" rx="8"/>
  <text class="small" x="560" y="485" text-anchor="middle">Apple frameworks: Foundation · SwiftUI/AppKit · Vision/ImageIO · CryptoKit · Quick Look · Security · CoreServices · Darwin</text>

  <rect class="box" x="1088" y="337" width="90" height="92" rx="10"/>
  <text class="label" x="1133" y="372" text-anchor="middle">Trash</text>
  <text class="small" x="1133" y="400" text-anchor="middle">macOS</text>
  <path class="line" d="M556 367 H644"/>
  <path class="line" d="M411 429 V443 H1133 V429"/>
</svg>
